name: Deploy website to GitHub Pages

on:
  push:
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Only publish from the repository's default branch
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify search engines (IndexNow)
        continue-on-error: true
        run: |
          URLS=$(grep -o '<loc>[^<]*</loc>' website/sitemap.xml | sed -e 's#<loc>##' -e 's#</loc>##' | python3 -c 'import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"akashicmonk.blog\",\"key\":\"a94c1acdcf469f29091a1ef8512e21d0\",\"keyLocation\":\"https://akashicmonk.blog/a94c1acdcf469f29091a1ef8512e21d0.txt\",\"urlList\":$URLS}" \
            -w "\nIndexNow HTTP %{http_code}\n"
